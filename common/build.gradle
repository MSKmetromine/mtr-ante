plugins {
	id "com.github.johnrengelman.shadow"
}

apply from: "../process_access_widener.gradle"

dependencies {
	modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	modApi "${rootProject.architectury_id}:architectury:${rootProject.architectury_version}"

	modApi("me.shedaniel.cloth:cloth-config:${rootProject.cloth_config_version}") { transitive = false }

	if (rootProject.minecraft_main_version < 20) {
		modCompileOnly("maven.modrinth:station-decoration:${rootProject.station_decoration_version}-fabric,${minecraft_version}")
		modCompileOnly("maven.modrinth:russian-metro-addon:fabric-${rootProject.russian_metro_version}")
	}
}

architectury {
	injectInjectables = false
	common("fabric", "forge")
}

loom {
	mixin {
		defaultRefmapName = "mixins.mtrsteamloco.refmap.json"
	}
	accessWidenerPath = processAccessWidener(file("./src/main/resources/mtrsteamloco.accesswidener"), file("./src/main/resources/mtrsteamloco_filtered.accesswidener"))
}